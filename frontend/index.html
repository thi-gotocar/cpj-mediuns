<!doctype html>
<html lang="pt-BR">
<head>

<meta name="description" content="Escala da gira: presença, sorteio de cambones e médiuns de passe, exportação para o WhatsApp.">
<meta name="theme-color" content="#2c4ea3">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@600;700&family=Alegreya+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="/css/estilo.css">
<script type="module" src="/js/main.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="topo-id">
      <img class="topo-logo" src="/img/terreiro.png" width="52" height="52" alt="">
      <div>
      <div class="eyebrow">Casa do Pai João</div>
      <h1 class="saud"><span class="saud-oi">Seja bem-vindo,</span><span class="saud-nome" id="saud-nome"></span></h1>
      </div>
    </div>
    <div class="conta" id="conta"></div>

  <nav class="tabs" role="tablist" id="tabs" hidden>

    <button role="tab" data-tab="perfil">Perfil</button>
    <button role="tab" data-tab="usuarios" hidden>Usuários</button>
  </nav>
  <main id="main"><div class="loading">Carregando…</div></main>
  <footer class="rodape" id="rodape" hidden></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
