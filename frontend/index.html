<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Sort Médiuns</title>
<meta name="description" content="Escala da gira: presença, sorteio de cambones e médiuns de passe, exportação para o WhatsApp.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#11151c">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sort Médiuns">
<link rel="stylesheet" href="/css/fontes.css">
<link rel="stylesheet" href="/css/estilo.css">
<script type="module" src="/js/atualizacao.js"></script>
<script type="module" src="/js/main.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="topo-id">
      <img class="topo-logo" src="/img/terreiro.png" width="52" height="52" alt="">
      <div>
      <div class="eyebrow">Casa do Pai João</div>
      <h1 class="saud"><span class="saud-oi">Seja bem-vindo,</span><span class="saud-nome" id="saud-nome"></span></h1>
      <div class="saud-extra" id="saud-extra"></div>
      </div>
    </div>
    <div class="conta" id="conta"></div>
  </header>
  <nav class="tabs" role="tablist" id="tabs" hidden>
    <button role="tab" data-tab="gira">Geral</button>
    <button role="tab" data-tab="agenda">Gira</button>
    <button role="tab" data-tab="fila" hidden>Fila</button>
    <button role="tab" data-tab="oraculo" hidden>Oráculo</button>
    <button role="tab" data-tab="oraculoAdm" hidden>Admin</button>
    <button role="tab" data-tab="diario" hidden>Diário</button>
    <button role="tab" data-tab="hist">Histórico</button>
    <button role="tab" data-tab="ervas" hidden>Ervas</button>
    <button role="tab" data-tab="oferendas" hidden>Oferendas</button>
    <button role="tab" data-tab="guias" hidden>Compras</button>
    <button role="tab" data-tab="amaci" hidden>Amaci</button>
    <button role="tab" data-tab="fotos" hidden>Fotos</button>
    <button role="tab" data-tab="curimba" hidden>Curimba</button>
    <button role="tab" data-tab="videos" hidden>Vídeos</button>
    <button role="tab" data-tab="perfil">Perfil</button>
    <button role="tab" data-tab="transparencia" hidden>Transparência</button>
    <button role="tab" data-tab="asaas" hidden>ASAAS</button>
    <button role="tab" data-tab="pedidos" hidden>Pedidos</button>
    <button role="tab" data-tab="usuarios" hidden>Admin root</button>
  </nav>
  <main id="main"><div class="loading">Carregando…</div></main>
  <footer class="rodape" id="rodape" hidden></footer>
  <div class="versao-linha"><small class="versao-app" id="versao-app" hidden></small><button type="button" class="atualizar-app" id="atualizar-app">Atualizar app</button></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
