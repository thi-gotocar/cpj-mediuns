<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sort Médiuns</title>
<meta name="description" content="Escala da gira: presença, sorteio de cambones e médiuns de passe, exportação para o WhatsApp.">
<meta name="theme-color" content="#2c4ea3">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sort Médiuns">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@600;700&family=Alegreya+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap">
<style>
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: coluna única estreita, abas fixas no topo; cada aba é uma folha de trabalho da gira */
:root{
  --bg:#f5f7fb; --surface:#ffffff; --ink:#18212f; --muted:#5b6678; --line:#dde3ec;
  --accent:#2c4ea3; --accent-ink:#ffffff; --accent-soft:#e6ecfa;
  --gold:#a8771c; --ok:#24785a; --ok-soft:#e1f2ea; --off:#a2423a; --off-soft:#f8e6e4; --warn:#9a6a10; --warn-soft:#f8efd9;
  --f-display:"Alegreya",Georgia,"Times New Roman",serif;
  --f-body:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151c; --surface:#19202a; --ink:#e7ebf2; --muted:#9aa5b6; --line:#2a3340;
  --accent:#8fa9ff; --accent-ink:#0f1626; --accent-soft:#1f2a44;
  --gold:#e2b75e; --ok:#63c597; --ok-soft:#163327; --off:#ee8a82; --off-soft:#3a1d1b; --warn:#e8bd62; --warn-soft:#3a2f15;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151c; --surface:#19202a; --ink:#e7ebf2; --muted:#9aa5b6; --line:#2a3340;
  --accent:#8fa9ff; --accent-ink:#0f1626; --accent-soft:#1f2a44;
  --gold:#e2b75e; --ok:#63c597; --ok-soft:#163327; --off:#ee8a82; --off-soft:#3a1d1b; --warn:#e8bd62; --warn-soft:#3a2f15;
  color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:grid;gap:18px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.9rem;font-weight:700}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1.05rem;font-weight:600}
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sync{font-size:.8rem;color:var(--muted)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:6px;display:flex;gap:4px;border-bottom:1px solid var(--line)}
nav.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:10px 6px;font:700 .95rem var(--f-body);color:var(--muted);cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
section.panel{display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:14px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{min-width:0}
.grow{flex:1 1 180px}
label.field{display:grid;gap:4px;font-size:.85rem;font-weight:700;color:var(--muted)}
input[type=text],input[type=date],select,textarea{font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;box-sizing:border-box}
textarea{font-family:var(--f-mono);font-size:.82rem;line-height:1.5;min-height:220px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:700 .95rem var(--f-body);border-radius:8px;padding:10px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:6px 10px;font-size:.85rem}
.btn.danger{color:var(--off)}
.btn.link{border:0;background:none;color:var(--accent);padding:4px 0}
.datehead{display:grid;gap:2px}
.datehead .dia{font-family:var(--f-display);font-size:1.5rem;font-weight:700;text-transform:capitalize}
.datehead .ent{color:var(--gold);font-weight:700}
.grp{display:grid;gap:6px}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.grp-h .count{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.pres{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 6px 6px 10px;background:var(--bg);font:500 .95rem var(--f-body);color:var(--ink);text-align:left;min-width:0}
.pres select.st{width:auto;border:0;cursor:pointer;appearance:auto;font-family:var(--f-body);text-transform:none;letter-spacing:0;font-size:.8rem;padding:4px 6px;border-radius:6px}
.pres .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pres .st{font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:20px;padding:2px 8px;flex:none;background:var(--ok-soft);color:var(--ok)}
.pres.aus{opacity:.8}
.pres.aus .nm{text-decoration:line-through;color:var(--muted)}
.pres.aus .st{background:var(--off-soft);color:var(--off)}
.pres.na .st{background:var(--warn-soft);color:var(--warn)}
.pres.na .nm{color:var(--muted)}
.pres.nc .st{background:var(--accent-soft);color:var(--accent)}
.pairs{display:grid;gap:8px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:8px}
.pair:last-child{border-bottom:0;padding-bottom:0}
.pair .med{font-weight:700;font-size:1.02rem}
.pair .cams{grid-column:1/-1;display:grid;gap:6px}
.camrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.camrow select{width:auto;flex:1 1 140px;padding:6px 9px}
.badge{font-size:.75rem;font-weight:700;border-radius:20px;padding:2px 8px;white-space:nowrap}
.badge.new{background:var(--ok-soft);color:var(--ok)}
.badge.rep{background:var(--accent-soft);color:var(--accent)}
.badge.hot{background:var(--warn-soft);color:var(--warn)}
.badge.re{background:var(--off-soft);color:var(--off)}
.lock{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 9px;font:700 .8rem var(--f-body);color:var(--muted);cursor:pointer}
.lock[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.rule{font-size:.88rem;color:var(--muted);display:grid;gap:4px;padding-left:18px;margin:0}
.check{display:flex;gap:8px;align-items:center;font-size:.92rem}
.check.small{font-size:.82rem;color:var(--muted);gap:6px}
.nmcell{display:grid;gap:2px;min-width:0}
.tag{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.xp{display:inline-grid;place-items:center;width:1.2em;height:1.2em;border-radius:50%;background:var(--warn-soft);color:var(--gold);font-size:.7rem;font-weight:700;vertical-align:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--muted);font:700 .85rem var(--f-body);padding:7px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ppl{display:grid;gap:0}
.pp{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.pp:last-child{border-bottom:0}
.pp .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp select{width:auto;padding:6px 8px;font-size:.92rem}
.hist{display:grid;gap:0}
.hi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.hi:last-child{border-bottom:0}
.hi .d{font-weight:700;text-transform:capitalize}
.hi .acts{display:flex;gap:6px}
.matrix{overflow-x:auto}
.matrix table{border-collapse:collapse;font-size:.85rem;font-variant-numeric:tabular-nums}
.matrix th,.matrix td{border:1px solid var(--line);padding:5px 8px;text-align:center;white-space:nowrap}
.matrix th{font-weight:700;color:var(--muted);background:var(--bg)}
.matrix th.rh{text-align:left;color:var(--ink)}
.matrix td.z{color:var(--muted)}
.matrix td.h1{background:var(--accent-soft);color:var(--accent);font-weight:700}
.matrix td.h2{background:var(--accent);color:var(--accent-ink);font-weight:700}
.empty{text-align:center;padding:28px 16px;display:grid;gap:10px;justify-items:center}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:.9rem;font-weight:500}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:700;z-index:20;max-width:calc(100% - 32px)}
.prev{width:100%;max-width:440px;justify-self:center;border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){.pres,.btn,.lock{transition:background .15s,border-color .15s,opacity .15s}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Escala da corrente</div>
      <h1>Sort Médiuns</h1>
    </div>
    <div class="sync" id="sync"></div>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-gira" data-tab="gira">Gira</button>
    <button role="tab" id="tab-pessoas" data-tab="pessoas">Pessoas</button>
    <button role="tab" id="tab-hist" data-tab="hist">Histórico</button>
  </nav>
  <main id="main"><div class="loading">Carregando a corrente…</div></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const FUNCOES=[
  {k:'medium',label:'Médium',pl:'Médiuns'},
  {k:'cambone',label:'Cambone',pl:'Cambones'},
  {k:'passe',label:'Passe',pl:'Passe'},
  {k:'senha',label:'Senha',pl:'Senha'},
  {k:'extra',label:'Extra',pl:'Extras'},
];
const FL=Object.fromEntries(FUNCOES.map(f=>[f.k,f]));
const LS='sortmediuns:v1', PREF='sortmediuns:prefs';

function hoje(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function pd(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function dLong(s){return pd(s).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});}
function dShort(s){return pd(s).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});}
function dDM(s){return pd(s).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});}
function wd(s){return pd(s).toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','');}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

let prefs={tab:'gira',data:hoje(),fmt:'lista',extras:false};
try{Object.assign(prefs,JSON.parse(localStorage.getItem(PREF)||'{}'));}catch(e){}
function savePrefs(){try{localStorage.setItem(PREF,JSON.stringify(prefs));}catch(e){}}

const state={pessoas:{},giras:{},ready:false,mode:'local',confirm:null};
let db=null;
const dirty=new Set();
const timers={};

/* ---------- armazenamento ---------- */
function loadLocal(){try{const o=JSON.parse(localStorage.getItem(LS)||'{}');state.pessoas=o.pessoas||{};state.giras=o.giras||{};}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({pessoas:state.pessoas,giras:state.giras}));}catch(e){}}
function strip(o){const c={...o};delete c.id;return c;}

async function init(){
  state.mode='local';loadLocal();state.ready=true;render();
  window.addEventListener('storage',e=>{if(e.key===LS){loadLocal();render();}});
}
async function write(fn){
  try{await fn();}catch(e){
    if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,400+Math.random()*600));try{await fn();return;}catch(e2){e=e2;}}
    toast(e&&e.code==='quota_exceeded'?'Espaço cheio: exclua giras antigas no Histórico.':'Não foi possível salvar. Tente de novo.');
  }
}
function setPessoa(p){
  state.pessoas[p.id]=p;render();
  if(db)write(()=>db.doc('pessoas/'+p.id).set(strip(p)));else saveLocal();
}
function delPessoa(id){
  delete state.pessoas[id];render();
  if(db)write(()=>db.doc('pessoas/'+id).delete());else saveLocal();
}
function setGira(g,now){
  state.giras[g.data]=g;
  if(!db){saveLocal();return;}
  dirty.add(g.data);clearTimeout(timers[g.data]);
  const go=async()=>{const cur=state.giras[g.data];if(!cur){dirty.delete(g.data);return;}await write(()=>db.doc('giras/'+g.data).set(strip(cur)));dirty.delete(g.data);};
  if(now)go();else timers[g.data]=setTimeout(go,700);
}
function delGira(id){
  delete state.giras[id];render();
  if(db)write(()=>db.doc('giras/'+id).delete());else saveLocal();
}

/* ---------- dados derivados ---------- */
function ativos(){return Object.values(state.pessoas).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));}
function nome(id){return state.pessoas[id]?.nome||'(removido)';}
function giraAtual(){return state.giras[prefs.data]||{data:prefs.data,entidade:'',presenca:{},pares:[]};}
function patchGira(p,now){const g={...giraAtual(),...p,atualizado:Date.now()};setGira(g,now);}
function status(p,g){const v=(g.presenca||{})[p.id];return v===false?'a':v==='f'?'f':v==='na'?'na':(v==='nc'||v==='sup')?'sup':'p';}
function cambonaHoje(p,g){const s=status(p,g);return (s==='p'&&p.funcao==='cambone')||s==='na';}
function presente(p,g){return status(p,g)==='p';}
const ST={p:'Presente',na:'Não atende',sup:'Suporte',f:'Falta',a:'Ausente'};
function prox(p,s){return p.funcao==='cambone'?{p:'nc',nc:'na',na:'a',a:'p'}[s]:{p:'na',na:'a',a:'p',nc:'na'}[s];}
function suporte(g){return ativos().filter(p=>status(p,g)==='sup');}
function naoAtende(g){return ativos().filter(p=>status(p,g)==='na');}
function ehCambone(p){return p.funcao==='cambone';}
function recebe(p){return p.funcao==='medium'||p.funcao==='extra';}
function ordRecebe(a,b){return (a.funcao===b.funcao?0:a.funcao==='medium'?-1:1)||a.nome.localeCompare(b.nome,'pt-BR');}

function custos(ate,campo){
  campo=campo||'pares';
  const h=Object.values(state.giras).filter(g=>g.data<ate&&g[campo]&&g[campo].length).sort((a,b)=>b.data.localeCompare(a.data));
  const map={},ultimaDoMedium={};
  h.forEach((g,k)=>{
    g[campo].forEach(p=>{
      const key=p.m+'|'+p.c;const e=map[key]||(map[key]={n:0,peso:0,ultima:null,recente:false});
      e.n++;e.peso+=1/(k+1);if(!e.ultima)e.ultima=g.data;
      if(ultimaDoMedium[p.m]===undefined)ultimaDoMedium[p.m]=g.data;
      if(ultimaDoMedium[p.m]===g.data)e.recente=true;
    });
  });
  return map;
}
function custo(map,m,c){const e=map[m+'|'+c];return e?e.peso*4+e.n+(e.recente?6:0):0;}

/* distribui cada item de "big" entre os de "small", por igual, com menor custo de repetição */
function balancear(big,small,cost,fixos){
  const base=Math.floor(big.length/small.length), extra=big.length%small.length;
  let best=[],bestCost=Infinity;
  for(let t=0;t<600;t++){
    const cnt=Object.fromEntries(small.map(s=>[s,0]));const usados=new Set();const res=[];let total=0;
    fixos.forEach(f=>{if(usados.has(f.b)||!(f.s in cnt))return;usados.add(f.b);cnt[f.s]++;res.push({b:f.b,s:f.s,fixo:true});total+=cost(f.b,f.s);});
    let acima=small.filter(s=>cnt[s]>base).length;
    for(const b of shuffle(big.filter(x=>!usados.has(x)))){
      let pick=null,pc=Infinity;
      for(const s of small){
        if(!(cnt[s]<base||(cnt[s]===base&&acima<extra)))continue;
        const v=cost(b,s)+Math.random()*0.6;
        if(v<pc){pc=v;pick=s;}
      }
      if(pick===null){for(const s of small){const v=Math.random();if(v<pc){pc=v;pick=s;}}}
      if(cnt[pick]===base)acima++;
      cnt[pick]++;
      res.push({b,s:pick,fixo:false});total+=cost(b,pick);
    }
    if(total<bestCost-1e-9){bestCost=total;best=res;}
  }
  return best;
}

function sortear(){
  const g=giraAtual();const ps=ativos().filter(p=>presente(p,g));
  const meds=ps.filter(recebe).map(p=>p.id);
  const cams=ativos().filter(p=>cambonaHoje(p,g)).map(p=>p.id);
  const passes=ps.filter(p=>p.funcao==='passe').map(p=>p.id);
  const hosts=ps.filter(p=>p.funcao==='medium'&&p.experiente).map(p=>p.id);
  const msgs=[];const patch={};
  if(meds.length&&cams.length){
    const map=custos(g.data,'pares');
    const fx=(g.pares||[]).filter(p=>p.fixo&&meds.includes(p.m)&&cams.includes(p.c));
    const mm=meds.length>=cams.length;
    const r=mm?balancear(meds,cams,(b,s)=>custo(map,b,s),fx.map(f=>({b:f.m,s:f.c})))
              :balancear(cams,meds,(b,s)=>custo(map,s,b),fx.map(f=>({b:f.c,s:f.m})));
    patch.pares=r.map(x=>mm?{m:x.b,c:x.s,fixo:x.fixo}:{m:x.s,c:x.b,fixo:x.fixo});
    msgs.push(patch.pares.filter(p=>!map[p.m+'|'+p.c]).length+' de '+patch.pares.length+' duplas novas');
  }else msgs.push(!meds.length?'nenhum médium presente':'nenhum cambone presente');
  if(passes.length){
    if(hosts.length){
      const map=custos(g.data,'passes');
      const fx=(g.passes||[]).filter(p=>p.fixo&&hosts.includes(p.m)&&passes.includes(p.c));
      const r=balancear(passes,hosts,(b,s)=>custo(map,s,b),fx.map(f=>({b:f.c,s:f.m})));
      patch.passes=r.map(x=>({m:x.s,c:x.b,fixo:x.fixo}));
      msgs.push(patch.passes.length+' médiuns de passe distribuídos');
    }else msgs.push('nenhum médium marcado para ter passe junto');
  }
  if(Object.keys(patch).length){patchGira(patch,true);render();}
  toast('Sorteado: '+msgs.join('; ')+'.');
}


/* remanejamento de última hora: mantém duplas válidas e realoca só quem foi afetado */
function remanejar(){
  const g=giraAtual();const all=ativos();
  const pr={...(g.presenca||{})};const gx={presenca:pr};
  const R=all.filter(p=>presente(p,gx)&&recebe(p)).map(p=>p.id);
  const C=new Set(all.filter(p=>cambonaHoje(p,gx)).map(p=>p.id));
  if(!R.length){toast('Nenhum médium presente.');return;}
  const map=custos(g.data,'pares');
  let pares=(g.pares||[]).filter(p=>R.includes(p.m)&&C.has(p.c)).map(p=>({...p}));
  const notas=[];
  const camsDe=m=>pares.filter(p=>p.m===m);
  const medsDe=c=>pares.filter(p=>p.c===c);
  const best=(xs,f)=>{let b=null,bv=Infinity;xs.forEach(x=>{const v=f(x)+Math.random()*0.3;if(v<bv){bv=v;b=x;}});return b;};
  const add=(m,c)=>pares.push({m,c,fixo:false,remanejado:true});
  const tira=p=>{pares=pares.filter(x=>x!==p);};
  let livres=[...C].filter(c=>!medsDe(c).length);
  // 1) nenhum médium sem cambone
  for(const m of shuffle(R.filter(m=>!camsDe(m).length))){
    if(livres.length){const c=best(livres,c=>custo(map,m,c));livres=livres.filter(x=>x!==c);add(m,c);continue;}
    const doa=pares.filter(p=>camsDe(p.m).length>=2);
    if(doa.length){const pp=best(doa,p=>(p.fixo?50:0)+custo(map,m,p.c));tira(pp);add(m,pp.c);notas.push(nome(pp.c)+' saiu de '+nome(pp.m));continue;}
    const sup=all.filter(p=>status(p,gx)==='sup');
    if(sup.length){const s=best(sup,p=>(p.funcao==='cambone'?0:5)+custo(map,m,p.id));pr[s.id]=s.funcao==='cambone'?true:'na';C.add(s.id);add(m,s.id);notas.push(s.nome+' saiu do suporte');continue;}
    if(C.size){const c=best([...C],c=>medsDe(c).length*10+custo(map,m,c));add(m,c);notas.push(nome(c)+' acompanha dois médiuns');continue;}
    notas.push(nome(m)+' ficou sem cambone');
  }
  // 2) cambones livres aliviam quem acompanha dois médiuns
  while(livres.length){
    const comp=pares.filter(p=>!p.fixo&&medsDe(p.c).length>=2);if(!comp.length)break;
    const pp=best(comp,p=>-medsDe(p.c).length);const c=best(livres,c=>custo(map,pp.m,c));
    tira(pp);add(pp.m,c);livres=livres.filter(x=>x!==c);
  }
  // 3) cambones livres vão para médiuns com um só cambone (máximo dois)
  while(livres.length){
    const alvo=R.filter(m=>camsDe(m).length<2);if(!alvo.length)break;
    const c=livres[0];const m=best(alvo,m=>camsDe(m).length*10+custo(map,m,c));add(m,c);livres.shift();
  }
  // 4) excedente vai para o suporte
  livres.forEach(c=>{pr[c]='sup';notas.push(nome(c)+' foi para o suporte');});
  // médiuns de passe
  const hosts=all.filter(p=>presente(p,gx)&&p.funcao==='medium'&&p.experiente).map(p=>p.id);
  const passeIds=all.filter(p=>presente(p,gx)&&p.funcao==='passe').map(p=>p.id);
  let passes=(g.passes||[]).filter(p=>hosts.includes(p.m)&&passeIds.includes(p.c)).map(p=>({...p}));
  const mapP=custos(g.data,'passes');
  passeIds.filter(id=>!passes.some(p=>p.c===id)).forEach(id=>{
    if(!hosts.length){notas.push(nome(id)+' (passe) ficou sem médium');return;}
    const m=best(hosts,h=>passes.filter(p=>p.m===h).length*10+custo(mapP,h,id));passes.push({m,c:id,fixo:false,remanejado:true});
  });
  const n=pares.filter(p=>p.remanejado).length+passes.filter(p=>p.remanejado).length;
  patchGira({pares,passes,presenca:pr},true);render();
  toast(n||notas.length?('Remanejado: '+n+' ajuste(s)'+(notas.length?'. '+notas.join('; '):'')+'.'):'Nada a remanejar.');
}

function paresPorMedium(g){
  const ps=ativos().filter(p=>presente(p,g));
  const ids=new Set(ativos().filter(p=>presente(p,g)||status(p,g)==='na').map(p=>p.id));
  const meds=ps.filter(recebe).sort(ordRecebe);
  const validos=(g.pares||[]).filter(p=>ids.has(p.m)&&ids.has(p.c));
  const passeIds=ps.filter(p=>p.funcao==='passe').map(p=>p.id);
  const passesV=(g.passes||[]).filter(p=>ids.has(p.m)&&passeIds.includes(p.c));
  const invalidos=(g.pares||[]).length-validos.length+(g.passes||[]).length-passesV.length;
  const semPasse=passeIds.filter(id=>!passesV.some(p=>p.c===id));
  return {meds,validos,passesV,semPasse,invalidos,lista:meds.map(m=>({m,cams:validos.filter(p=>p.m===m.id),passes:passesV.filter(p=>p.m===m.id)}))};
}

/* ---------- exportação ---------- */
function corta(s,n){return s.length>n?s.slice(0,n-1)+'…':s;}
function tabela(L,h1,h2,rows){
  const w=Math.min(14,Math.max(h1.length,...rows.map(r=>r[0].length)));
  L.push('```');
  L.push(h1.padEnd(w)+' │ '+h2);
  L.push('─'.repeat(w)+'─┼─'+'─'.repeat(14));
  rows.forEach(r=>r[1].forEach((c,i)=>L.push((i===0?corta(r[0],w):'').padEnd(w)+' │ '+corta(c,16))));
  L.push('```');
}
function textoWhats(){
  const g=giraAtual();const ps=ativos();
  const pres=ps.filter(p=>presente(p,g)),aus=ps.filter(p=>status(p,g)==='a');
  const {lista,semPasse}=paresPorMedium(g);
  const L=[];
  L.push('*GIRA · '+wd(g.data).toUpperCase()+', '+dShort(g.data)+'*');
  if(g.entidade)L.push('*Entidade:* '+g.entidade);
  L.push('');
  L.push('*Médiuns e cambones*');
  const tab=prefs.fmt==='tabela';
  if(tab){
    tabela(L,'MÉDIUM','CAMBONE',lista.map(x=>[x.m.funcao==='extra'?corta(x.m.nome,12)+' *':x.m.nome,x.cams.length?x.cams.map(p=>nome(p.c)):['—']]));
    if(lista.some(x=>x.m.funcao==='extra'))L.push('_* extra_');
  }else{
    lista.forEach(x=>L.push('• '+x.m.nome+(x.m.funcao==='extra'?' (extra)':'')+' → '+(x.cams.length?x.cams.map(p=>nome(p.c)).join(' e '):'—')));
  }
  const comPasse=lista.filter(x=>x.passes.length);
  if(comPasse.length||semPasse.length){
    L.push('');L.push('*Médiuns de passe*');
    if(tab){
      tabela(L,'MÉDIUM','PASSE',comPasse.map(x=>[x.m.nome,x.passes.map(p=>nome(p.c))]).concat(semPasse.length?[['(sem médium)',semPasse.map(nome)]]:[]));
    }else{
      comPasse.forEach(x=>L.push('• '+x.passes.map(p=>nome(p.c)).join(' e ')+' com '+x.m.nome));
      semPasse.forEach(id=>L.push('• '+nome(id)+' → sem médium'));
    }
  }
  const usados=new Set((g.pares||[]).map(p=>p.c));
  const sen=pres.filter(p=>p.funcao==='senha').map(p=>p.nome);
  if(sen.length){L.push('');L.push('*Senha:* '+sen.join(', '));}
  const sup=suporte(g).map(p=>p.nome);
  if(sup.length){L.push('');L.push('*Suporte:* '+sup.join(', '));}
  const sobra=ps.filter(p=>cambonaHoje(p,g)&&!usados.has(p.id)).map(p=>p.nome);
  if(sobra.length){L.push('');L.push('*Cambones de apoio:* '+sobra.join(', '));}
  const fal=ps.filter(p=>status(p,g)==='f').map(p=>p.nome);
  if(fal.length){L.push('');L.push('*Faltas:* '+fal.join(', '));}
  if(aus.length){L.push('');L.push('*Ausentes:* '+aus.map(p=>p.nome).join(', '));}
  return L.join('\n');
}

/* ---------- imagem da escala ---------- */
const IMG={bg:'#f5f7fb',card:'#ffffff',ink:'#18212f',muted:'#5b6678',line:'#dde3ec',accent:'#2c4ea3',soft:'#c9d5f5',gold:'#a8771c'};
const FD='"Alegreya",Georgia,serif',FB='"Alegreya Sans",system-ui,sans-serif';
let img=null;
function chaveImg(){const f=prefs.fmt;prefs.fmt='lista';const t=textoWhats();prefs.fmt=f;return t;}
function wrapTxt(ctx,t,max){const out=[];String(t).split('\n').forEach(par=>{let line='';par.split(' ').forEach(w=>{const tst=line?line+' '+w:w;if(ctx.measureText(tst).width>max&&line){out.push(line);line=w;}else line=tst;});out.push(line);});return out;}
function rrect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function layoutImg(ctx,draw){
  const g=giraAtual(),ps=ativos();const {lista,semPasse}=paresPorMedium(g);
  const W=720,P=32,CW=W-2*P;let y;
  const font=(w,s,f)=>{ctx.font=`${w} ${s}px ${f||FB}`;};
  const ls=v=>{try{ctx.letterSpacing=v;}catch(e){}};
  /* cabeçalho */
  const t0=dLong(g.data),tit=t0.charAt(0).toUpperCase()+t0.slice(1);
  font(700,36,FD);const tl=wrapTxt(ctx,tit,CW);
  font(700,22);const el=g.entidade?wrapTxt(ctx,g.entidade,CW):[];
  const hh=P+22+tl.length*42+(el.length?6+el.length*28:0)+P;
  y=P;
  if(draw){
    ctx.fillStyle=IMG.accent;ctx.fillRect(0,0,W,hh);
    font(700,13);ls('2px');ctx.fillStyle=IMG.soft;ctx.fillText('ESCALA DA GIRA · '+dShort(g.data),P,y);ls('0px');
  }
  y+=22;
  if(draw){font(700,36,FD);ctx.fillStyle='#ffffff';tl.forEach((l,i)=>ctx.fillText(l,P,y+i*42));}
  y+=tl.length*42;
  if(el.length){y+=6;if(draw){font(700,22);ctx.fillStyle='#f2d58f';el.forEach((l,i)=>ctx.fillText(l,P,y+i*28));}y+=el.length*28;}
  y=hh+20;
  /* blocos em duas colunas */
  const secao=(titulo,c1,c2,rows)=>{
    if(!rows.length)return;
    const ix=P+20,leftW=CW*0.44-20,rx=P+CW*0.44+8,rightW=CW*0.56-28;
    const rs=rows.map(r=>{font(700,19);const ll=wrapTxt(ctx,r.l,leftW);font(400,19);const rl=r.r.flatMap(t=>wrapTxt(ctx,t,rightW));
      return {...r,ll,rl,h:Math.max(ll.length*25+(r.tag?18:0),rl.length*25)+18};});
    const ch=20+30+22+rs.reduce((a,r)=>a+r.h,0)+10;
    if(draw){ctx.fillStyle=IMG.card;rrect(ctx,P,y,CW,ch,14);ctx.fill();ctx.strokeStyle=IMG.line;ctx.lineWidth=1;ctx.stroke();}
    let yy=y+20;
    if(draw){font(700,24,FD);ctx.fillStyle=IMG.ink;ctx.fillText(titulo,ix,yy);}
    yy+=30;
    if(draw){font(700,12);ls('1.5px');ctx.fillStyle=IMG.muted;ctx.fillText(c1,ix,yy);ctx.fillText(c2,rx,yy);ls('0px');}
    yy+=22;
    rs.forEach(r=>{
      if(draw){
        ctx.strokeStyle=IMG.line;ctx.beginPath();ctx.moveTo(ix,yy+.5);ctx.lineTo(P+CW-20,yy+.5);ctx.stroke();
        let ly=yy+9;font(700,19);ctx.fillStyle=r.mut?IMG.muted:IMG.ink;r.ll.forEach(l=>{ctx.fillText(l,ix,ly);ly+=25;});
        if(r.tag){font(700,12);ls('1.5px');ctx.fillStyle=IMG.gold;ctx.fillText(r.tag,ix,ly);ls('0px');}
        let ry=yy+9;font(400,19);ctx.fillStyle=r.vazio?IMG.muted:IMG.ink;r.rl.forEach(l=>{ctx.fillText(l,rx,ry);ry+=25;});
      }
      yy+=r.h;
    });
    y+=ch+16;
  };
  secao('Médiuns e cambones','MÉDIUM','CAMBONE',lista.map(x=>({l:x.m.nome,tag:x.m.funcao==='extra'?'EXTRA':'',r:x.cams.length?x.cams.map(p=>nome(p.c)):['—'],vazio:!x.cams.length})));
  const comPasse=lista.filter(x=>x.passes.length);
  secao('Médiuns de passe','MÉDIUM','PASSE',comPasse.map(x=>({l:x.m.nome,r:x.passes.map(p=>nome(p.c))})).concat(semPasse.length?[{l:'Sem médium',mut:true,r:semPasse.map(nome)}]:[]));
  /* demais grupos */
  const pres=ps.filter(p=>presente(p,g));
  const usados=new Set((g.pares||[]).map(p=>p.c));
  const info=[
    ['SENHA',pres.filter(p=>p.funcao==='senha').map(p=>p.nome)],
    ['SUPORTE',suporte(g).map(p=>p.nome)],
    ['CAMBONES DE APOIO',ps.filter(p=>cambonaHoje(p,g)&&!usados.has(p.id)).map(p=>p.nome)],
    ['FALTAS',ps.filter(p=>status(p,g)==='f').map(p=>p.nome)],
    ['AUSENTES',ps.filter(p=>status(p,g)==='a').map(p=>p.nome)],
  ].filter(i=>i[1].length);
  if(info.length){
    const ix=P+20,iw=CW-40;
    font(400,19);const it=info.map(i=>({k:i[0],ll:wrapTxt(ctx,i[1].join(', '),iw)}));
    const ch=20+it.reduce((a,i)=>a+20+i.ll.length*25+14,0)+6;
    if(draw){ctx.fillStyle=IMG.card;rrect(ctx,P,y,CW,ch,14);ctx.fill();ctx.strokeStyle=IMG.line;ctx.stroke();}
    let yy=y+20;
    it.forEach(i=>{
      if(draw){font(700,12);ls('1.5px');ctx.fillStyle=IMG.muted;ctx.fillText(i.k,ix,yy);ls('0px');}
      yy+=20;
      if(draw){font(400,19);ctx.fillStyle=IMG.ink;i.ll.forEach((l,k)=>ctx.fillText(l,ix,yy+k*25));}
      yy+=i.ll.length*25+14;
    });
    y+=ch+16;
  }
  if(draw){font(500,13);ctx.fillStyle=IMG.muted;ctx.textAlign='center';ctx.fillText('Sort Médiuns',W/2,y+2);ctx.textAlign='left';}
  return y+2+16+P-8;
}
async function gerarImagem(){
  try{await Promise.all(['700 36px Alegreya','700 24px Alegreya','400 19px "Alegreya Sans"','700 19px "Alegreya Sans"','500 13px "Alegreya Sans"'].map(f=>document.fonts.load(f)));}catch(e){}
  const S=1.5,W=720,c=document.createElement('canvas');
  let ctx=c.getContext('2d');ctx.textBaseline='top';
  const H=Math.ceil(layoutImg(ctx,false));
  c.width=W*S;c.height=Math.ceil(H*S);
  ctx=c.getContext('2d');ctx.scale(S,S);ctx.textBaseline='top';
  ctx.fillStyle=IMG.bg;ctx.fillRect(0,0,W,H);
  layoutImg(ctx,true);
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  if(!blob){toast('Não consegui gerar a imagem neste aparelho.');return;}
  if(img)URL.revokeObjectURL(img.url);
  img={url:URL.createObjectURL(blob),blob,key:chaveImg(),nome:'gira-'+prefs.data+'.png'};
  render();
  const pv=document.getElementById('img-prev');if(pv)pv.scrollIntoView({behavior:'smooth',block:'center'});
}

    h+=`<div class="pairs">`;
    lista.forEach(x=>{
      h+=`<div class="pair"><span class="med">${esc(x.m.nome)}${x.m.funcao==='extra'?' <span class="badge rep">Extra</span>':''}</span><span class="muted" style="font-size:.85rem">${x.cams.length} cambone${x.cams.length===1?'':'s'}</span><div class="cams">`;
      x.cams.forEach(p=>{h+=linha('pares',p,(g.pares||[]).indexOf(p),camsPres,map,'');});
      if(!x.cams.length)h+=`<span class="muted">Sem cambone. Sorteie de novo.</span>`;
      x.passes.forEach(p=>{h+=linha('passes',p,(g.passes||[]).indexOf(p),passPres,mapP,'Passe');});
      h+=`</div></div>`;
    });
    h+=`</div>`;
  }
  const sup=suporte(g);
  if(sup.length)h+=`<div class="grp"><div class="grp-h"><h3>Suporte</h3><span class="count">${sup.length}</span></div><p style="margin:0">${sup.map(p=>esc(p.nome)).join(', ')}</p></div>`;
  h+=`<details><summary class="muted" style="cursor:pointer;font-size:.9rem">Como o sorteio decide</summary>
    <ul class="rule">
      <li>Médiuns e extras recebem cambone.</li>
      <li>Quem está como “Não atende” entra no sorteio como cambone, junto com os cambones presentes.</li>
      <li>Quem está em Suporte fica fora do sorteio.</li>
      <li><b>Remanejar faltas</b> não mexe nas duplas que continuam válidas. Só realoca quem foi afetado por uma falta: médium sem cambone recebe um cambone livre; se não houver, sai um cambone de um médium que tem dois; depois alguém do Suporte; por último, um cambone passa a acompanhar dois médiuns. Cambones que sobram vão para médiuns com um só cambone (máximo de dois por médium) e o excedente vai para o Suporte.</li>
      <li>Médiuns de passe não recebem cambone: cada um é sorteado para ficar com um médium marcado como “pode ter passe junto”, com o mesmo rodízio.</li>
      <li>Dupla que nunca trabalhou junta tem prioridade.</li>
      <li>A dupla da última gira do médium é evitada sempre que houver outra opção.</li>
      <li>Duplas antigas pesam menos que recentes; quanto mais vezes juntas, menor a chance.</li>
      <li>Os cambones são divididos por igual. Se faltar cambone, alguns acompanham dois médiuns; se sobrar, alguns médiuns ganham dois.</li>
      <li>Duplas fixadas ficam como estão. Entre opções empatadas, a escolha é aleatória.</li>
    </ul></details></div>`;

  const txt=textoWhats();
  h+=`<div class="card"><div class="grp-h"><h2>WhatsApp</h2>
    <div class="seg" role="group" aria-label="Formato"><button data-act="fmt" data-v="lista" aria-pressed="${prefs.fmt==='lista'}">Lista</button><button data-act="fmt" data-v="tabela" aria-pressed="${prefs.fmt==='tabela'}">Tabela</button></div></div>
    <textarea id="f-txt" readonly aria-label="Texto para o WhatsApp">${esc(txt)}</textarea>
    <div class="row"><button class="btn primary" data-act="copiar">Copiar texto</button>
    <a class="btn" href="https://wa.me/?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">Abrir no WhatsApp</a></div>`;
  const imgOk=img&&img.key===chaveImg();
  h+=`<div class="grp" style="border-top:1px solid var(--line);padding-top:14px"><div class="grp-h"><h3>Imagem da escala</h3>
    <button class="btn ${imgOk?'':'primary'}" data-act="gerarimg">${img&&!imgOk?'Gerar de novo':imgOk?'Atualizar':'Gerar imagem'}</button></div>`;
  if(img&&!imgOk)h+=`<p class="muted" style="margin:0;font-size:.88rem">A escala mudou desde a última imagem. Gere de novo.</p>`;
  else if(!img)h+=`<p class="muted" style="margin:0;font-size:.88rem">Gera um PNG com a escala da gira, pronto para mandar no grupo.</p>`;
  if(imgOk){
    const share=podeCompartilhar();
    h+=`<img id="img-prev" class="prev" src="${img.url}" alt="Imagem da escala da gira">
      <div class="row">${share?'<button class="btn primary" data-act="shareimg">Compartilhar</button>':''}<button class="btn ${share?'':'primary'}" data-act="saveimg">Salvar imagem</button></div>
      <p class="muted" style="margin:0;font-size:.88rem">No celular, também dá para tocar e segurar a imagem para salvar.</p>`;
  }
  h+=`</div></div>`;
  return h+'</section>';
}

function vPessoas(){
  const ps=ativos();
  let h=`<section class="panel"><div class="card"><h2>Adicionar pessoas</h2>
    <form id="f-add" class="row">
      <label class="field grow">Nome<input type="text" id="f-nome" placeholder="Um nome, ou vários separados por vírgula" autocomplete="off"></label>
      <label class="field" style="flex:0 1 150px">Função<select id="f-func">${FUNCOES.map(f=>`<option value="${f.k}" ${f.k===(prefs.lastFunc||'medium')?'selected':''}>${f.label}</option>`).join('')}</select></label>
      <button class="btn primary" type="submit">Adicionar</button>
    </form></div>`;
  if(!ps.length)return h+`<div class="card empty"><p class="muted">Ninguém cadastrado ainda. Digite os nomes acima; pode colar uma lista inteira separada por vírgulas ou por linha.</p><button class="btn" data-act="exemplo">Carregar exemplo</button></div></section>`;
  FUNCOES.forEach(f=>{
    const gp=ps.filter(p=>p.funcao===f.k);if(!gp.length)return;
    h+=`<div class="card"><div class="grp-h"><h2>${f.pl}</h2><span class="count">${gp.length}</span></div><div class="ppl">`;
    gp.forEach(p=>{
      const conf=state.confirm===p.id;
      h+=`<div class="pp"><span class="nmcell"><span class="nm">${esc(p.nome)}</span>${p.funcao==='medium'?`<label class="check small"><input type="checkbox" id="exp-${p.id}" data-act="exp" data-id="${p.id}" ${p.experiente?'checked':''}> Pode ter médium de passe junto</label>`:''}</span>
        <select id="fn-${p.id}" data-act="func" data-id="${p.id}" aria-label="Função de ${esc(p.nome)}">${FUNCOES.map(o=>`<option value="${o.k}" ${o.k===p.funcao?'selected':''}>${o.label}</option>`).join('')}</select>
        ${conf?`<button class="btn small danger" data-act="del" data-id="${p.id}">Confirmar</button>`:`<button class="btn small" data-act="askdel" data-id="${p.id}">Excluir</button>`}</div>`;
    });
    h+=`</div></div>`;
  });
  return h+'</section>';
}

function vHist(){
  const gs=Object.values(state.giras).sort((a,b)=>b.data.localeCompare(a.data));
  let h=`<section class="panel"><div class="card"><h2>Giras salvas</h2>`;
  if(!gs.length)h+=`<p class="muted">Nenhuma gira ainda. Marque a presença e sorteie na aba Gira; tudo é salvo automaticamente.</p>`;
  else{
    h+=`<div class="hist">`;
    gs.forEach(g=>{
      const np=ativos().filter(p=>presente(p,g)).length;const conf=state.confirm==='g:'+g.data;
      h+=`<div class="hi"><div><div class="d">${esc(dLong(g.data))} <span class="muted" style="font-weight:400">${dShort(g.data).slice(-4)}</span></div>
        <div class="muted" style="font-size:.9rem">${esc(g.entidade||'Entidade não definida')} · ${(g.pares||[]).length} duplas · ${np} presentes</div></div>
        <div class="acts"><button class="btn small" data-act="abrir" data-d="${g.data}">Abrir</button>
        ${conf?`<button class="btn small danger" data-act="delg" data-d="${g.data}">Confirmar</button>`:`<button class="btn small" data-act="askdelg" data-d="${g.data}">Excluir</button>`}</div></div>`;
    });
    h+=`</div>`;
  }
  h+=`</div>`;
  const meds=ativos().filter(recebe).sort(ordRecebe),cams=ativos().filter(ehCambone);
  if(meds.length&&cams.length&&gs.some(g=>(g.pares||[]).length)){
    const cnt={};gs.forEach(g=>(g.pares||[]).forEach(p=>{const k=p.m+'|'+p.c;cnt[k]=(cnt[k]||0)+1;}));
    const usedC=cams.filter(c=>meds.some(m=>cnt[m.id+'|'+c.id]));
    h+=`<div class="card"><h2>Quem já cambonou quem</h2><p class="muted" style="margin:0;font-size:.9rem">Vezes que cada cambone acompanhou cada médium, em todas as giras.</p>
      <div class="matrix"><table><thead><tr><th></th>${usedC.map(c=>`<th>${esc(c.nome)}</th>`).join('')}</tr></thead><tbody>
      ${meds.map(m=>`<tr><th class="rh">${esc(m.nome)}</th>${usedC.map(c=>{const n=cnt[m.id+'|'+c.id]||0;return `<td class="${n===0?'z':n===1?'h1':'h2'}">${n||'·'}</td>`;}).join('')}</tr>`).join('')}
      </tbody></table></div></div>`;
  }
  h+=`<div class="card"><h2>Backup</h2><p class="muted" style="margin:0;font-size:.9rem">Os dados ficam salvos neste aparelho e navegador. Baixe um backup de vez em quando, e use-o para levar a corrente para outro aparelho.</p>
    <div class="row"><button class="btn" data-act="backup">Baixar backup</button>
    <label class="btn" for="f-import" style="cursor:pointer">Restaurar backup</label><input type="file" id="f-import" accept="application/json,.json" hidden></div></div>`;
  return h+'</section>';
}

/* ---------- eventos ---------- */
let toastT;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600);}

document.querySelector('nav.tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;prefs.tab=b.dataset.tab;state.confirm=null;savePrefs();render();});

main.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.tagName==='SELECT'||el.tagName==='INPUT')return;
  const a=el.dataset.act;const g=giraAtual();
  if(a!=='askdel'&&a!=='askdelg')state.confirm=null;
  if(a==='goto'){prefs.tab=el.dataset.tab;savePrefs();render();}
  else if(a==='pres'){const pr={...(g.presenca||{})};const pp=state.pessoas[el.dataset.id];const nx=prox(pp,status(pp,g));pr[el.dataset.id]=nx==='p'?true:nx==='a'?false:nx;patchGira({presenca:pr});render();}
  else if(a==='todos'){const pr={...(g.presenca||{})};ativos().filter(p=>p.funcao===el.dataset.f).forEach(p=>pr[p.id]=el.dataset.v==='1');patchGira({presenca:pr});render();}
  else if(a==='sortear'){sortear();}
  else if(a==='remanejar'){remanejar();}
  else if(a==='fixo'){const k=el.dataset.k||'pares';const arr=(g[k]||[]).map((p,i)=>i===+el.dataset.i?{...p,fixo:!p.fixo}:p);patchGira({[k]:arr},true);render();}
  else if(a==='fmt'){prefs.fmt=el.dataset.v;savePrefs();render();}
  else if(a==='copiar'){
    const txt=textoWhats();
    const fb=()=>{const t=document.getElementById('f-txt');t.focus();t.select();toast('Texto selecionado. Copie com o menu do aparelho.');};
    try{navigator.clipboard.writeText(txt).then(()=>toast('Copiado. Cole no grupo do WhatsApp.'),fb);}catch(err){fb();}
  }
  else if(a==='gerarimg'){gerarImagem();}
  else if(a==='saveimg'&&img){
    const l=document.createElement('a');l.href=img.url;l.download=img.nome;document.body.appendChild(l);l.click();l.remove();
  }
  else if(a==='shareimg'&&img){
    navigator.share({files:[new File([img.blob],img.nome,{type:'image/png'})],title:'Escala da gira'}).catch(err=>{if(err&&err.name!=='AbortError')toast('Não deu para compartilhar daqui. Use Salvar imagem.');});
  }
  else if(a==='backup'){
    const b=new Blob([JSON.stringify({app:'sort-mediuns',versao:1,exportado:new Date().toISOString(),pessoas:state.pessoas,giras:state.giras},null,1)],{type:'application/json'});
    const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download='sort-mediuns-backup-'+hoje()+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
  }
  else if(a==='exemplo'){
    const ex={medium:['Ana (exemplo)','Bruno (exemplo)','Carla (exemplo)','Diego (exemplo)'],cambone:['Elisa (exemplo)','Fábio (exemplo)','Gabi (exemplo)'],passe:['Helena (exemplo)','Kátia (exemplo)'],senha:['Igor (exemplo)'],extra:['Júlia (exemplo)']};
    Object.entries(ex).forEach(([f,ns])=>ns.forEach((n,i)=>setPessoa({id:uid(),nome:n,funcao:f,experiente:f==='medium'&&i<2})));
    toast('Exemplo carregado. Exclua os nomes na aba Pessoas quando quiser.');
  }
  else if(a==='askdel'){state.confirm=el.dataset.id;render();}
  else if(a==='del'){state.confirm=null;delPessoa(el.dataset.id);}
  else if(a==='askdelg'){state.confirm='g:'+el.dataset.d;render();}
  else if(a==='delg'){state.confirm=null;delGira(el.dataset.d);}
  else if(a==='abrir'){prefs.data=el.dataset.d;prefs.tab='gira';savePrefs();render();window.scrollTo(0,0);}
  else render();
});

main.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='f-import'&&t.files&&t.files[0]){
    const f=t.files[0];t.value='';
    f.text().then(txt=>{
      const o=JSON.parse(txt);
      if(!o||typeof o.pessoas!=='object'||typeof o.giras!=='object')throw new Error('formato');
      if(!confirm('Restaurar este backup? Os dados atuais deste aparelho serão substituídos.'))return;
      state.pessoas=o.pessoas;state.giras=o.giras;saveLocal();render();
      toast('Backup restaurado: '+Object.keys(o.pessoas).length+' pessoas e '+Object.keys(o.giras).length+' giras.');
    }).catch(()=>toast('Arquivo de backup inválido.'));
    return;
  }
  if(t.id==='f-data'&&t.value){prefs.data=t.value;savePrefs();render();}
  else if(t.id==='f-extras'){prefs.extras=t.checked;savePrefs();render();}
  else if(t.dataset.act==='troca'){const g=giraAtual();const k=t.dataset.k||'pares';const arr=(g[k]||[]).map((p,i)=>i===+t.dataset.i?{...p,c:t.value}:p);patchGira({[k]:arr},true);render();}
  else if(t.dataset.act==='exp'){const p=state.pessoas[t.dataset.id];if(p)setPessoa({...p,experiente:t.checked});}
  else if(t.dataset.act==='status'){const g=giraAtual();const pr={...(g.presenca||{})};const v=t.value;pr[t.dataset.id]=v==='p'?true:v==='a'?false:v;patchGira({presenca:pr});render();}
  else if(t.dataset.act==='func'){const p=state.pessoas[t.dataset.id];if(p)setPessoa({...p,funcao:t.value});}
});

main.addEventListener('input',e=>{
  if(e.target.id==='f-ent'){
    patchGira({entidade:e.target.value});
    const ta=document.getElementById('f-txt');if(ta)ta.value=textoWhats();
    const head=document.querySelector('.datehead');
    if(head){let s=head.querySelector('.ent');if(!s){s=document.createElement('span');s.className='ent';head.appendChild(s);}s.textContent=e.target.value;}
  }
});

main.addEventListener('submit',e=>{
  if(e.target.id!=='f-add')return;e.preventDefault();
  const v=document.getElementById('f-nome').value;const f=document.getElementById('f-func').value;
  prefs.lastFunc=f;savePrefs();
  const nomes=v.split(/[,;\n]+/).map(s=>s.trim()).filter(Boolean);
  if(!nomes.length){toast('Digite pelo menos um nome.');return;}
  const exist=new Set(ativos().map(p=>p.nome.toLowerCase()));
  let n=0;nomes.forEach(nm=>{if(exist.has(nm.toLowerCase()))return;exist.add(nm.toLowerCase());setPessoa({id:uid(),nome:nm,funcao:f});n++;});
  toast(n?(n+' adicionada'+(n>1?'s':'')+' como '+FL[f].label+'.'):'Esses nomes já estão cadastrados.');
  const inp=document.getElementById('f-nome');if(inp){inp.value='';inp.focus();}
});

render();
init();
})();
</script>

</body></html>
