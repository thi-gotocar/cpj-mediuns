name: Build & Test

on:
  push:
    branches: ['main', 'dev']
  pull_request:
    branches: ['main']

jobs:
  build-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_PASSWORD: ""
          POSTGRES_USER: postgres
          POSTGRES_DB: test_mediuns
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Build
        run: npm run build
      
      - name: Test
        run: npm test
        env:
          DATABASE_URL: postgres://postgres:@127.0.0.1:5432/test_mediuns
          CODIGO_INSTALACAO: test-ci-code
          # test/apoio.js: sem root no runner, o psql conecta direto no Postgres do serviço
          PGHOST: 127.0.0.1
          PGUSER: postgres
